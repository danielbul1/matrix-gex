name: Update CBOE Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fetch_cboe.py"
      - ".github/workflows/update-cboe.yml"
  schedule:
    - cron: "1-59/5 13-20 * * 1-5"
    - cron: "17,47 0-12,21-23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-cboe-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch CBOE data
        run: python fetch_cboe.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cboe_data.json
          git diff --cached --quiet || git commit -m "Update CBOE data"
          git pull --rebase origin main
          git push
