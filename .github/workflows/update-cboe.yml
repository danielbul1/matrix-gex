name: Update LSE Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fetch_lse.py"
      - "tools/build_data_status.py"
      - "tools/build_exposure_history.py"
      - "tools/smoke_check.py"
      - ".github/workflows/update-cboe.yml"
  schedule:
    # Once per hour during US market hours (13-20 UTC, Mon-Fri).
    # The LSE key's plan tier is unverified; the free plan allows ~10
    # historical downloads/hour and one full refresh uses ~8 downloads
    # (4 options + 4 candles), so hourly cadence stays within the free tier.
    # If the key is on a registered/paid plan, restore 15-minute cadence:
    #   - cron: "2,17,32,47 13-20 * * 1-5"
    - cron: "13 13-20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-lse-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validation scripts
        run: python -m py_compile fetch_lse.py tools/build_data_status.py tools/build_exposure_history.py tools/smoke_check.py

      - name: Fetch LSE data
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 2100))
          while [ "$SECONDS" -lt "$end" ]; do
            now_utc=$(date -u +%H%M)
            git fetch origin data || true
            if python fetch_lse.py && python tools/build_data_status.py && MATRIX_REQUIRE_FRESH_DATA=1 python tools/smoke_check.py; then
              rm -rf /tmp/matrix-gex-data
              mkdir -p /tmp/matrix-gex-data
              cp cboe_data.json candles_data.json data_status.json /tmp/matrix-gex-data/
              cp tools/build_exposure_history.py /tmp/matrix-gex-data/
              git restore -- cboe_data.json data_status.json
              if git show-ref --verify --quiet refs/remotes/origin/data; then
                git switch --force-create data origin/data
              else
                git switch --orphan data
                git rm -rf .
              fi
              cp /tmp/matrix-gex-data/cboe_data.json /tmp/matrix-gex-data/candles_data.json /tmp/matrix-gex-data/data_status.json .
              python /tmp/matrix-gex-data/build_exposure_history.py --input cboe_data.json --root exposure_history --retain 7
              git add cboe_data.json candles_data.json data_status.json exposure_history
              if ! git diff --cached --quiet; then
                git commit -m "Update LSE data"
                git push origin data
              fi
              git switch main
            else
              echo "Fetch or validation failed; skipping commit for this interval"
              git restore -- cboe_data.json data_status.json
            fi
            if [ "$now_utc" -lt "1325" ] || [ "$now_utc" -gt "2015" ]; then
              break
            fi
            sleep 300
          done
