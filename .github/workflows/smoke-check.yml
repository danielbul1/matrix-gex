name: Smoke Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cboe_data.json"
      - "data_status.json"
      - "fetch_cboe.py"
      - "server.py"
      - "tools/**"
      - ".github/workflows/smoke-check.yml"
      - ".github/workflows/update-cboe.yml"
  push:
    branches: [main]
    paths:
      - "cboe_data.json"
      - "data_status.json"
      - "fetch_cboe.py"
      - "server.py"
      - "tools/**"
      - ".github/workflows/smoke-check.yml"
      - ".github/workflows/update-cboe.yml"

permissions:
  contents: read

concurrency:
  group: smoke-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m py_compile server.py fetch_cboe.py tools/gamma_exposure.py tools/build_data_status.py tools/smoke_check.py

      - name: Run dashboard smoke check
        run: python tools/smoke_check.py
