name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish artifact (exclude data files, logs, server code)
        run: |
          mkdir public
          rsync -a --exclude 'public' \
            --exclude '.git' --exclude '.github' --exclude '.claude' \
            --exclude '__pycache__' --exclude '*.pyc' --exclude '*.log' \
            --exclude 'cboe_data.json' --exclude 'spy.json' \
            --exclude 'candles_data.json' --exclude 'cboe_open_data.json' \
            --exclude 'exposure_history' \
            --exclude '*.py' --exclude '*.ps1' --exclude 'requirements.txt' \
            --exclude '.env*' --exclude 'functions' \
            --exclude 'railway-service' \
            ./ public/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
