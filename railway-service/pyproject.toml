[project]
name = "tripity-mcp-core-experiment"
version = "0.1.0"
description = "Tripity done-for-you AI connector: OpenAPI to curated MCP links"
requires-python = ">=3.12"
dependencies = [
    "cryptography==48.0.1",
    "fastapi==0.138.2",
    "fastmcp==3.4.2",
    "httpx==0.28.1",
    "lse-data==0.14.0",
    "mcp==1.28.1",
    "starlette==1.3.1",
    "tzdata==2026.3",
    "uvicorn==0.49.0",
]

[project.scripts]
tripity = "tripity_experiment.cli:main"
tripity-host = "tripity_experiment.personal_host:main"
tripity-portal = "tripity_experiment.portal:main"
tripity-company-demo = "tripity_experiment.company_demo_host:main"
tripity-public-company-host = "tripity_experiment.public_company_host:main"

[project.optional-dependencies]
test = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
tripity_experiment = ["web/*.html", "web/*.css", "web/*.js"]
"tripity_experiment.web" = ["*.html", "*.css", "*.js"]
